
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Survival Battle 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:absolute;top:10px;left:10px;background:#000b;color:white;padding:10px;border-radius:10px;line-height:1.7}
#controls{position:absolute;bottom:12px;width:100%;display:flex;justify-content:space-between;padding:0 10px}
.pad{display:grid;grid-template-columns:48px 48px 48px;gap:5px}
button{height:48px;min-width:48px;background:#152433dd;color:white;border:1px solid white;border-radius:12px;font-size:18px}
.empty{visibility:hidden}
.actions{display:flex;flex-direction:column;gap:5px}
#fire{background:#c21e1e}
</style>
</head>
<body>
<div id="hud">
❤️ Health: <span id="hp">100</span><br>
🔫 Ammo: <span id="ammo">30</span><br>
🏆 Kills: <span id="kills">0</span><br>
🚗 <span id="mode">Walking</span>
</div>
<div id="controls">
<div class="pad">
<button class="empty"></button><button data-k="up">⬆️</button><button class="empty"></button>
<button data-k="left">⬅️</button><button data-k="down">⬇️</button><button data-k="right">➡️</button>
</div>
<div class="actions">
<button id="jump">Jump</button>
<button id="carBtn">🚗 Car</button>
<button id="fire">🔥 Fire</button>
<button id="reload">Reload</button>
</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,60,180);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,400);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x54613b,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(30,50,20);
sun.castShadow=true;
scene.add(sun);

const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});
function add(parent,geo,color,x,y,z){
const m=new THREE.Mesh(geo,mat(color));
m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;
}
function human(shirt=0x2466b8){
const g=new THREE.Group();
add(g,new THREE.CylinderGeometry(.25,.32,.8,12),shirt,0,1.2,0);
add(g,new THREE.SphereGeometry(.25,16,12),0xd9a078,0,1.82,0);
add(g,new THREE.SphereGeometry(.27,16,12),0x222222,0,2.03,0);
// Face
add(g,new THREE.SphereGeometry(.035,8,8),0x111111,-.085,1.87,.22);
add(g,new THREE.SphereGeometry(.035,8,8),0x111111,.085,1.87,.22);
add(g,new THREE.ConeGeometry(.045,.12,8),0xd9a078,0,1.82,.27);
add(g,new THREE.BoxGeometry(.1,.025,.02),0x632c27,0,1.72,.24);
for(const s of [-1,1]){
add(g,new THREE.CapsuleGeometry(.1,.42,4,8),0xd9a078,s*.39,1.25,0);
add(g,new THREE.SphereGeometry(.12,10,10),0xd9a078,s*.4,.93,0);
add(g,new THREE.CylinderGeometry(.12,.14,.7,10),0x303d52,s*.16,.43,0);
add(g,new THREE.BoxGeometry(.22,.14,.32),0x171717,s*.16,.07,.1);
for(let i=0;i<4;i++)
add(g,new THREE.CylinderGeometry(.018,.018,.12,6),0xd9a078,s*.4+(i-1.5)*.04,.83,.02);
}
return g;
}

const ground=add(scene,new THREE.PlaneGeometry(300,300),0x4b873b,0,-.08,0);
ground.rotation.x=-Math.PI/2;

const road=add(scene,new THREE.PlaneGeometry(16,250),0x444444,0,-.04,0);
road.rotation.x=-Math.PI/2;

const player=human();
scene.add(player);
const gun=new THREE.Group();
add(gun,new THREE.BoxGeometry(.12,.13,.7),0x202020,0,0,0);
add(gun,new THREE.BoxGeometry(.1,.2,.14),0x555555,0,-.13,.1);
gun.position.set(.4,1.3,.48);player.add(gun);

// Trees
function tree(x,z){
const t=new THREE.Group();
add(t,new THREE.CylinderGeometry(.15,.22,2,8),0x754b2c,0,1,0);
add(t,new THREE.SphereGeometry(1.15,12,10),0x176b2b,0,2.5,0);
add(t,new THREE.SphereGeometry(.7,10,10),0x318b35,.5,2.8,0);
t.position.set(x,0,z);scene.add(t);
}
for(let i=0;i<75;i++){
let x=(Math.random()-.5)*150,z=(Math.random()-.5)*180;
if(Math.abs(x)>11)tree(x,z);
}

// Houses with doorways
function house(x,z){
const h=new THREE.Group();
add(h,new THREE.BoxGeometry(10,.2,9),0x888888,0,.1,0);
add(h,new THREE.BoxGeometry(10,4,.3),0xd1b58c,0,2,-4.5);
add(h,new THREE.BoxGeometry(.3,4,9),0xd1b58c,-5,2,0);
add(h,new THREE.BoxGeometry(.3,4,9),0xd1b58c,5,2,0);
add(h,new THREE.BoxGeometry(3.5,4,.3),0xd1b58c,-3.25,2,4.5);
add(h,new THREE.BoxGeometry(3.5,4,.3),0xd1b58c,3.25,2,4.5);
add(h,new THREE.BoxGeometry(10.5,.4,9.5),0x783b2c,0,4.1,0);
h.position.set(x,0,z);scene.add(h);
}
house(20,-25);house(-25,-35);house(25,30);house(-30,30);

// Car
const car=new THREE.Group();
add(car,new THREE.BoxGeometry(4,.8,7),0xc52222,0,.9,0);
add(car,new THREE.BoxGeometry(3,1.1,3.4),0x34566a,0,1.7,-.2);
for(let x of [-2,2])for(let z of [-2.2,2.2]){
const w=add(car,new THREE.CylinderGeometry(.55,.55,.35,16),0x171717,x,.5,z);
w.rotation.z=Math.PI/2;
}
car.position.set(7,0,8);scene.add(car);

// Friends
const friends=[];
for(let i=0;i<3;i++){
const f=human(0x239a73);
f.position.set(-5+i*4,0,-8-i*3);
const fg=add(f,new THREE.BoxGeometry(.12,.12,.65),0x202020,.4,1.3,.4);
f.userData.last=0;
scene.add(f);friends.push(f);
}

// Enemies
const enemies=[];
for(let i=0;i<8;i++){
const e=human(0x9d2929);
e.position.set(Math.random()*55-27,0,Math.random()*55-27);
scene.add(e);enemies.push({mesh:e,hp:100});
}

// Input
const keys={};
document.querySelectorAll('[data-k]').forEach(b=>{
const k=b.dataset.k;
b.onpointerdown=e=>{e.preventDefault();keys[k]=true};
b.onpointerup=()=>keys[k]=false;
b.onpointerleave=()=>keys[k]=false;
b.onpointercancel=()=>keys[k]=false;
});
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let hp=100,ammo=30,kills=0,inCar=false,speed=0,angle=0;
let jumping=false,vy=0,audio;

function sound(){
try{
audio ||= new (window.AudioContext||window.webkitAudioContext)();
if(audio.state==='suspended')audio.resume();
const o=audio.createOscillator(),g=audio.createGain();
o.type='sawtooth';
o.frequency.setValueAtTime(140,audio.currentTime);
o.frequency.exponentialRampToValueAtTime(35,audio.currentTime+.14);
g.gain.setValueAtTime(.4,audio.currentTime);
g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);
o.connect(g);g.connect(audio.destination);
o.start();o.stop(audio.currentTime+.18);
}catch(e){}
}

function shoot(from,damage=50){
if(ammo<=0)return;
ammo--;sound();
let target=null,d=30;
enemies.forEach(e=>{
if(e.hp<=0)return;
const n=from.position.distanceTo(e.mesh.position);
if(n<d){d=n;target=e}
});
if(target){
target.hp-=damage;
if(target.hp<=0){
target.mesh.visible=false;kills++;
document.getElementById('kills').textContent=kills;
}
}
document.getElementById('ammo').textContent=ammo;
}
document.getElementById('fire').onclick=()=>{if(!inCar)shoot(player)};
document.getElementById('reload').onclick=()=>{
ammo=30;document.getElementById('ammo').textContent=ammo;
};
document.getElementById('jump').onclick=()=>{
if(!jumping&&!inCar){jumping=true;vy=.19}
};
function toggleCar(){
if(!inCar&&player.position.distanceTo(car.position)<8){
inCar=true;player.visible=false;
}else if(inCar){
inCar=false;player.visible=true;
player.position.copy(car.position);player.position.x+=3;
}
}
document.getElementById('carBtn').onclick=toggleCar;
addEventListener('keydown',e=>{
if(e.key.toLowerCase()==='e')toggleCar();
if(e.key.toLowerCase()==='f'&&!inCar)shoot(player);
});

const clock=new THREE.Clock();
function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.04);
const up=keys.up||keys.w,down=keys.down||keys.s;
const left=keys.left||keys.a,right=keys.right||keys.d;

if(inCar){
speed+=(Number(up)-Number(down))*dt*13;
speed*=.985;speed=THREE.MathUtils.clamp(speed,-12,22);
car.rotation.y+=(Number(right)-Number(left))*dt*1.5;
car.translateZ(-speed*dt);
}else{
if(left)angle+=dt*2;
if(right)angle-=dt*2;
player.rotation.y=angle;
player.translateZ(-(Number(up)-Number(down))*8*dt);
if(jumping){
player.position.y+=vy;vy-=.009;
if(player.position.y<=0){player.position.y=0;jumping=false}
}
}

// Friends attack nearby enemies
friends.forEach(f=>{
let target=null,d=35;
enemies.forEach(e=>{
if(e.hp<=0)return;
let n=f.position.distanceTo(e.mesh.position);
if(n<d){d=n;target=e}
});
if(target){
f.lookAt(target.mesh.position);
if(performance.now()-f.userData.last>1100){
target.hp-=10;f.userData.last=performance.now();sound();
if(target.hp<=0){
target.mesh.visible=false;kills++;
document.getElementById('kills').textContent=kills;
}
}
}
});

// Enemies follow player
enemies.forEach(e=>{
if(e.hp<=0||inCar)return;
let d=e.mesh.position.distanceTo(player.position);
if(d>4&&d<35){
let dir=player.position.clone().sub(e.mesh.position).normalize();
e.mesh.position.addScaledVector(dir,dt*1.2);
}
if(d<4)hp=Math.max(0,hp-dt*2);
});

const target=inCar?car:player;
const offset=new THREE.Vector3(0,6,11).applyQuaternion(target.quaternion);
camera.position.lerp(target.position.clone().add(offset),.12);
camera.lookAt(target.position.clone().add(new THREE.Vector3(0,1.3,0)));

document.getElementById('hp').textContent=Math.floor(hp);
document.getElementById('mode').textContent=inCar?'Driving':'Walking';
renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
  </html>
